<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Schedule — Daybook</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('daybook:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body class="loading">
<div class="app" id="app">
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="skeleton"><div class="card" style="height:520px"><div class="sk line" style="width:30%;height:20px"></div><div class="sk line"></div><div class="sk line"></div></div></div>

    <div class="content">
      <div class="week-strip" id="week"></div>
      <div class="day-view">
        <section class="card" aria-labelledby="day-h">
          <div class="card-head">
            <div><h2 id="day-h">Monday</h2><div class="sub" id="day-sub"></div></div>
            <span class="spacer"></span>
            <button class="btn secondary sm" id="add-event"><svg class="icon sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add event</button>
          </div>
          <div class="tl" id="tl"></div>
        </section>
        <aside class="day-side">
          <section class="card">
            <div class="card-head"><div><h2>At a glance</h2></div></div>
            <div class="kv"><span>Events</span><b id="g-count">0</b></div>
            <div class="kv"><span>Planned</span><b id="g-planned">0h</b></div>
            <div class="kv"><span>Focus</span><b id="g-focus">0h</b></div>
            <div class="kv"><span>Longest gap</span><b id="g-gap">—</b></div>
            <div class="kv"><span>First / last</span><b id="g-span">—</b></div>
          </section>
          <section class="card">
            <div class="card-head"><div><h2>Day shape</h2><div class="sub">Where the hours go</div></div></div>
            <div class="ribbon-track" id="mini-ribbon" style="height:44px"></div>
            <div class="ribbon-foot"></div>
          </section>
          <section class="card">
            <div class="card-head"><div><h2>Tasks that day</h2></div></div>
            <ul class="tasks" id="day-tasks"></ul>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/pages/schedule.js"></script>
</body>
</html>
