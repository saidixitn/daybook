<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="page-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBEBE4" />
      <stop offset="100%" stop-color="#DCDCD4" />
    </linearGradient>
    <linearGradient id="page-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2EB" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F2542D" />
      <stop offset="100%" stop-color="#FFA066" />
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5BFF" />
      <stop offset="100%" stop-color="#6588FF" />
    </linearGradient>
    <filter id="sun-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#F2542D" flood-opacity="0.5" />
    </filter>
    <filter id="ribbon-shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#db-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Rising Day Sun / Horizon Aperture -->
  <circle cx="32" cy="20" r="7.5" fill="url(#sun-grad)" filter="url(#sun-glow)" />
  <circle cx="32" cy="20" r="3.5" fill="#FFF7F2" />

  <!-- Open Book: Left Page -->
  <path d="M14 24.5C20.5 25.8 26.5 24.8 31 23V46C26.5 48 20 47 14 45.2V24.5Z" fill="url(#page-left)" />
  
  <!-- Open Book: Right Page -->
  <path d="M50 24.5C43.5 25.8 37.5 24.8 33 23V46C37.5 48 44 47 50 45.2V24.5Z" fill="url(#page-right)" />

  <!-- Spine Crease Shadow -->
  <path d="M31 23H33V46H31V23Z" fill="rgba(0,0,0,0.18)" />

  <!-- Right Page Subtle Note Lines -->
  <line x1="38" y1="30" x2="45" y2="30" stroke="rgba(26,26,24,0.18)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="38" y1="35" x2="43" y2="35" stroke="rgba(26,26,24,0.18)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Focused Bookmark Ribbon with Chevron Tail -->
  <path d="M29.5 21H34.5V48.5L32 46L29.5 48.5V21Z" fill="url(#ribbon-grad)" filter="url(#ribbon-shadow)" />
</svg>
