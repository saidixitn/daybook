<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242422" />
      <stop offset="100%" stop-color="#141413" />
    </linearGradient>
    <linearGradient id="db-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E5BFF" />
      <stop offset="100%" stop-color="#6288FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F26B3A" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#db-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Calm Horizon Day Ribbon -->
  <rect x="12" y="32" width="40" height="7" rx="3.5" fill="rgba(255,255,255,0.14)" />
  
  <!-- Focus Period Block -->
  <rect x="18" y="32" width="16" height="7" rx="3.5" fill="url(#db-accent)" />
  
  <!-- Subtle Morning Marker Line -->
  <path d="M12 21h16M12 26h24" stroke="rgba(255,255,255,0.38)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Signature Glowing Now Dot -->
  <circle cx="34" cy="35.5" r="4.5" fill="#F26B3A" filter="url(#glow)" />
  <circle cx="34" cy="35.5" r="2.2" fill="#FFF2ED" />
  
  <!-- Done Checklist pip -->
  <circle cx="46" cy="22" r="3" fill="#1FA463" />
</svg>
